name: Build iPhone app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack scanner-app.zip
        run: unzip -o -q scanner-app.zip
      - name: Put the scanner interface inside the app
        run: cp index.html ios/Resources/index.html
      - name: Create the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build the app (unsigned)
        run: |
          cd ios
          xcodebuild -project Scanner.xcodeproj -scheme Scanner -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet build
          test -d build/Build/Products/Release-iphoneos/Scanner.app
      - name: Package Scanner.ipa
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Scanner.app Payload/
          zip -qry Scanner.ipa Payload
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ios/Scanner.ipa --title "Latest iPhone build" --notes "Install with SideStore, SideInstaller or AltStore."
