# XcodeGen project description. The GitHub workflow turns this into Scanner.xcodeproj.
name: Scanner
options:
  bundleIdPrefix: com.diyscanner
  deploymentTarget:
    iOS: "16.2"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Scanner:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
    dependencies:
      - target: ScannerGauges
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Scanner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64]
        NSBluetoothAlwaysUsageDescription: Scanner uses Bluetooth to talk to your OBD-II adapter.
        NSCameraUsageDescription: Take a photo of your vehicle for the home screen.
        NSPhotoLibraryUsageDescription: Choose a photo of your vehicle for the home screen.
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UIBackgroundModes: [bluetooth-central]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diyscanner.scanner
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    scheme: {}

  # Live Activity (CarPlay Dashboard + Lock Screen gauges)
  ScannerGauges:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Gauges
      - path: Shared
    info:
      path: Gauges/Info.plist
      properties:
        CFBundleDisplayName: Scanner Gauges
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diyscanner.scanner.gauges
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
